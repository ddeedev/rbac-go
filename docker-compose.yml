services:
  backend:
    container_name: rbac-go
    build:
      context: .
      dockerfile: Dockerfile
    image: rbac-go:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "50051:50051"
    environment:
      PORT: 5001

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
